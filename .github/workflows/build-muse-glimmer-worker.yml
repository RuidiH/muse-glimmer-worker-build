name: Build MuseGlimmer Worker macOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          repository: facebookincubator/executorch
          ref: main
          path: executorch
      - name: Verify ExecuTorch checkout
        run: |
          ls executorch/examples/models/muse-glimmer
          head -n 5 executorch/README.md
      - name: Create dummy worker binary
        run: |
          echo '#!/bin/bash' > muse_glimmer_worker
          echo 'echo "muse_glimmer_worker built on $(uname -a)"' >> muse_glimmer_worker
          chmod +x muse_glimmer_worker
          ls -l muse_glimmer_worker
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-glimmer-worker
          path: muse_glimmer_worker
