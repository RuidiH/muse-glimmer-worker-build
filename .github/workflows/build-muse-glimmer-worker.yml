name: Build MuseGlimmer Worker macOS
on:
  workflow_dispatch:
    inputs:
      executorch_ref:
        description: ExecuTorch commit/branch/tag to build
        required: false
        default: 7a690f8cf8aec5a170d677ffebda28ba49c479c9
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          auto-activate-base: true
      - name: Show Xcode
        run: xcodebuild -version
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/executorch
          ref: ${{ github.event.inputs.executorch_ref || 'main' }}
          path: executorch
          submodules: recursive
      - name: Verify ExecuTorch checkout
        run: |
          ls executorch/examples/models/muse-glimmer
      - name: Install ExecuTorch Python deps
        working-directory: executorch
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate base
          python install_executorch.py
      - name: Build Muse Glimmer with MLX
        working-directory: executorch
        env:
          Python3_EXECUTABLE: ${{ env.CONDA }}/bin/python
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate base
          make muse-glimmer-mlx
      - name: Verify binaries
        working-directory: executorch
        run: |
          BIN_DIR=cmake-out/examples/models/muse-glimmer
          for bin in solo_runner dflash_runner muse_glimmer_worker; do
            if [ ! -x "${BIN_DIR}/${bin}" ]; then
              echo "Failed: ${bin} not found at ${BIN_DIR}/${bin}"
              exit 1
            fi
          done
          if [ ! -f "${BIN_DIR}/mlx.metallib" ]; then
            echo "Failed: mlx.metallib not copied next to the runners"
            exit 1
          fi
          echo "Success: built solo_runner, dflash_runner and muse_glimmer_worker"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-glimmer-worker-mlx
          path: |
            executorch/cmake-out/examples/models/muse-glimmer/muse_glimmer_worker
            executorch/cmake-out/examples/models/muse-glimmer/solo_runner
            executorch/cmake-out/examples/models/muse-glimmer/dflash_runner
            executorch/cmake-out/examples/models/muse-glimmer/mlx.metallib
