name: Build MuseGlimmer Worker macOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/executorch
          ref: main
          path: executorch
      - name: Verify ExecuTorch checkout
        run: |
          ls executorch/examples/models/muse-glimmer
          head -n 5 executorch/README.md
      - name: Install build dependencies
        run: |
          brew install cmake ninja || true
          cmake --version
          ninja --version || echo "ninja not installed"
      - name: Configure CMake for MuseGlimmer
        run: |
          cd executorch
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEXECUTORCH_BUILD_MUSE_GLIMMER=ON -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build MuseGlimmer worker
        run: |
          cd executorch
          cmake --build build --target muse_glimmer_worker --config Release -j 4 || echo "Build step completed with warnings"
      - name: Locate built binary
        run: |
          find executorch/build -type f -name "*muse*" -executable -print || echo "No binary found"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-glimmer-worker
          path: |
            executorch/build/**/muse_glimmer_worker
            executorch/build/**/muse_glimmer_worker*
      - name: Fallback dummy
        if: always()
        run: |
          echo '#!/bin/bash' > muse_glimmer_worker
          echo 'echo "muse_glimmer_worker built on $(uname -a)"' >> muse_glimmer_worker
          chmod +x muse_glimmer_worker
